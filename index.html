<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CheckIP – Kiểm Tra Địa Chỉ IP</title>
  <meta name="description" content="Kiểm tra địa chỉ IP của bạn ngay lập tức. Xem IP, vị trí, ISP, múi giờ và nhiều thông tin hơn nữa." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <!-- SheetJS: tạo file .xlsx trong trình duyệt -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
</head>
<body>
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>
  <div class="grid-overlay"></div>

  <div class="container">
    <header class="header">
      <div class="logo">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <line x1="2" y1="12" x2="22" y2="12"/>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
          </svg>
        </div>
        <span class="logo-text">CheckIP</span>
      </div>
      <div class="header-badge">
        <span class="pulse-dot"></span>
        <span>Live</span>
      </div>
    </header>

    <section class="hero">
      <p class="hero-label">Địa chỉ IP của bạn</p>
      <div class="ip-display" id="ipDisplay">
        <div class="ip-skeleton" id="ipSkeleton">
          <div class="skeleton-bar" style="width:220px;height:56px;border-radius:12px;"></div>
        </div>
        <div class="ip-value" id="ipValue" style="display:none;"></div>
      </div>
      <div class="ip-badges" id="ipBadges" style="display:none;">
        <span class="badge" id="badgeType"></span>
        <span class="badge badge-secure" id="badgeVPN" style="display:none;">🛡️ VPN Detected</span>
      </div>
      <div class="hero-actions">
        <button class="btn-copy" id="btnCopy" onclick="copyIP()" style="display:none;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
          <span id="copyText">Sao chép IP</span>
        </button>
        <button class="btn-save" id="btnSave" onclick="saveNote()" style="display:none;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
            <polyline points="17 21 17 13 7 13 7 21"/>
            <polyline points="7 3 7 8 15 8"/>
          </svg>
          <span id="saveText">Lưu .txt</span>
        </button>
      </div>
    </section>

    <section class="cards-grid" id="cardsGrid">
      <div class="info-card sk-card"><div class="sk-block"></div></div>
      <div class="info-card sk-card"><div class="sk-block"></div></div>
      <div class="info-card sk-card"><div class="sk-block"></div></div>
      <div class="info-card sk-card"><div class="sk-block"></div></div>
      <div class="info-card sk-card"><div class="sk-block"></div></div>
      <div class="info-card sk-card"><div class="sk-block"></div></div>
    </section>

    <section class="detail-section" id="detailSection" style="display:none;">
      <div class="detail-card">
        <div class="detail-header">
          <div class="detail-icon location-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
              <circle cx="12" cy="10" r="3"/>
            </svg>
          </div>
          <h3>Vị trí địa lý</h3>
        </div>
        <div class="detail-rows" id="locationRows"></div>
      </div>

      <div class="detail-card">
        <div class="detail-header">
          <div class="detail-icon network-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22">
              <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
            </svg>
          </div>
          <h3>Mạng &amp; ISP</h3>
        </div>
        <div class="detail-rows" id="networkRows"></div>
      </div>

      <div class="detail-card">
        <div class="detail-header">
          <div class="detail-icon system-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22">
              <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
              <line x1="8" y1="21" x2="16" y2="21"/>
              <line x1="12" y1="17" x2="12" y2="21"/>
            </svg>
          </div>
          <h3>Trình duyệt &amp; Hệ thống</h3>
        </div>
        <div class="detail-rows" id="systemRows"></div>
      </div>
    </section>

    <section class="map-section" id="mapSection" style="display:none;">
      <div class="map-header">
        <div class="map-title-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
            <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/>
            <line x1="8" y1="2" x2="8" y2="18"/>
            <line x1="16" y1="6" x2="16" y2="22"/>
          </svg>
          <span>Bản đồ vị trí</span>
        </div>
        <span class="map-coords" id="mapCoords"></span>
      </div>
      <div class="map-wrapper">
        <iframe id="mapIframe" class="map-iframe" allowfullscreen loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
      </div>
    </section>

    <section class="lookup-section">
      <h2 class="lookup-title">Tra cứu IP khác</h2>
      <p class="lookup-sub">Nhập địa chỉ IP bất kỳ để xem thông tin chi tiết</p>
      <div class="lookup-form">
        <div class="lookup-input-wrap">
          <svg class="lookup-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input type="text" id="lookupInput" class="lookup-input" placeholder="8.8.8.8 hoặc 2001:4860:4860::8888" autocomplete="off" />
        </div>
        <button class="btn-lookup" id="btnLookup" onclick="lookupIP()">
          Tra cứu
        </button>
      </div>
      <div class="lookup-result" id="lookupResult" style="display:none;"></div>
    </section>

    <footer class="footer">
      <p>Dữ liệu từ <a href="https://ipwho.is" target="_blank" rel="noopener">ipwho.is</a> · <a href="https://www.openstreetmap.org" target="_blank" rel="noopener">OpenStreetMap</a></p>

    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
